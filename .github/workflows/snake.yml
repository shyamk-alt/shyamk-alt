name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake from my contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Dark theme uses the orb colours: orange squares, blue snake.
          # Light theme uses the default palette.
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_snake=#4CB7FF&color_dots=#161B22,#5A2D17,#A24A1D,#FF6A2B,#FFC24A

      - name: Publish the images to the "output" branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
